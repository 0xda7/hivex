version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 21
    groups:
      all-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Root: dev-only tooling (secretlint, commitlint, @secretlint rule presets).
  # Bun-managed (bun.lock, no package-lock.json) — the npm_and_yarn updater
  # fails closed on bun.lock; the bun ecosystem is the supported path.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 21
    groups:
      all-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Web frontend (React/vite), managed with bun.lock — bun ecosystem.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 21
    groups:
      web-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(web)"
      include: "scope"

  # Playwright e2e harness. Self-contained bun workspace under web/e2e/ so
  # @playwright/test bumps don't entangle the main web build.
  - package-ecosystem: "bun"
    directory: "/web/e2e"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    groups:
      e2e-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(e2e)"
      include: "scope"

  # npm wrapper that ships `npx hivex` to the npm registry. Bumps here
  # affect the public install surface — keep its own group so they get
  # individual review, not lumped with the dev-tooling root group.
  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    groups:
      npm-wrapper-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(npm)"
      include: "scope"
